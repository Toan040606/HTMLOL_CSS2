<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý điểm sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="headerAndInput">
            <div class="header">
                <h2>Nhập điểm sinh viên</h2>
            </div>
            <div class="input">
                <input type="text" class="name" placeholder="Nhập tên sinh viên..."></input> <br>
                <input type="number" class="point" placeholder="Điểm số (0-10)..."></input> <br>
                <button class="addToList">Thêm vào danh sách</button> <br>
            </div>
        </div>
        <div class="list">
            <h6>DANH SÁCH LỚP</h6>
            <ul class="student-list"></ul>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
