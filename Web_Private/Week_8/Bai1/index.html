<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "notification">
        <p>Thông báo hiển thị tại đây!</p>
    </div>
    <div class="bmi-calculator-container">
        <div class="header"><h1>Tính chỉ số BMI</h1></div>
        <form class="bmi-calculator">
            <label for="weight" class="title">Cân nặng(kg):</label> <br>
            <input type="text" name="weight" class="text-box" placeholder="Nhập cân nặng"> <br>
            <label for="height" class="title">Chiều cao(m):</label> <br>
            <input type="text" name="height" class="text-box" placeholder="Nhập chiều cao"> <br>
            <button type="button">Tính toán</button>
        </form>
    </div>
</body>
</html>
